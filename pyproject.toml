[project]
name = "seven-tv-events"
version = "0.1.0"
description = "Unofficial async Python client for the 7TV EventAPI (WebSocket)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Aluerie", email = "aluerie@gmail.com" }
]
requires-python = ">=3.14"
keywords = ["7tv", "seventv", "twitch", "emotes", "eventapi", "websocket", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14.5",
]

[project.urls]
Repository = "https://github.com/Aluerie/seven-tv-events"
Issues = "https://github.com/Aluerie/seven-tv-events/issues"

[project.scripts]
seven-tv-events = "seven_tv_events._cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]
examples = [
    "twitchio>=3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--doctest-modules"]  # also runs the examples in docstrings
testpaths = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
# Preview: newest rules and formatter style, plus selecting individual rules by name.
preview = true

[tool.ruff.lint]
# Whole linters can only be selected by prefix code; individual rules use names below.
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "async-function-with-timeout",  # helpers pass `timeout` straight through to aiohttp / asyncio.timeout
    "async-busy-wait",              # the tests' `eventually` helper polls on purpose
    "unused-async",                 # event handlers are async by API contract, even when they don't await
]

[tool.uv]
# Install example dependencies too, so `ty check` can resolve them.
default-groups = ["dev", "examples"]
